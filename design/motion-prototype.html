<title>Quiz Word Motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 iPhone 프레임 안에서 실제로 조작하는 시안, 오른쪽에 그 화면의 모션 명세. 좁은 화면에서는 위아래로 쌓는다. */
:root {
  --page: #E9EBF3;
  --screen: #F2F3F8;
  --surface: #FFFFFF;
  --surface2: #F6F7FB;
  --line: #E3E6EF;
  --text: #161A2B;
  --text2: #4A5068;
  --muted: #8A90A6;
  --primary: #4F46E5;
  --primary2: #7C3AED;
  --primary-soft: #EEF0FF;
  --primary-text: #3730A3;
  --on-primary: #FFFFFF;
  --success: #059669;
  --success-soft: #E3F6EE;
  --danger: #E11D48;
  --danger-soft: #FDECF0;
  --warning: #B45309;
  --warning-soft: #FDF0DA;
  --marker: #FFEB85;
  --marker-text: #3D3000;
  --frame: #12141C;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 10px 28px rgb(16 24 40 / .10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --slow: 1;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #08090D; --screen: #000000; --surface: #1C1C1E; --surface2: #2C2C2E; --line: #2E2F36;
    --text: #ECEEF6; --text2: #B4B9CC; --muted: #7D8399; --primary: #818CF8; --primary2: #A78BFA;
    --primary-soft: #1F2245; --primary-text: #C7CEFF; --on-primary: #0E1018; --success: #34D399; --success-soft: #0F2A20;
    --danger: #FB7185; --danger-soft: #34151E; --warning: #FBBF24; --warning-soft: #2E2410; --marker: #5A4A08;
    --marker-text: #FFF3B0; --frame: #1F2129; --shadow: 0 0 0 1px rgb(255 255 255 / .06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #08090D; --screen: #000000; --surface: #1C1C1E; --surface2: #2C2C2E; --line: #2E2F36;
  --text: #ECEEF6; --text2: #B4B9CC; --muted: #7D8399; --primary: #818CF8; --primary2: #A78BFA;
  --primary-soft: #1F2245; --primary-text: #C7CEFF; --on-primary: #0E1018; --success: #34D399; --success-soft: #0F2A20;
  --danger: #FB7185; --danger-soft: #34151E; --warning: #FBBF24; --warning-soft: #2E2410; --marker: #5A4A08;
  --marker-text: #FFF3B0; --frame: #1F2129; --shadow: 0 0 0 1px rgb(255 255 255 / .06); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.top h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; text-wrap: balance; }
.top p { margin: 6px 0 0; color: var(--text2); font-size: 14px; max-width: 60ch; line-height: 1.55; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.seg button { padding: 7px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--text2); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--text2); }
.toggle[aria-pressed="true"] { color: var(--primary-text); background: var(--primary-soft); }

.main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); justify-items: center; } }

/* iPhone 프레임 */
.device { width: 392px; height: 812px; padding: 11px; border-radius: 58px; background: var(--frame); box-shadow: 0 30px 60px rgb(10 12 30 / .25); position: relative; }
.screen { position: relative; height: 100%; border-radius: 47px; overflow: hidden; background: var(--screen); display: flex; flex-direction: column; }
.status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font-size: 15px; font-weight: 600; }
.island { position: absolute; top: 11px; left: 50%; width: 118px; height: 34px; border-radius: 20px; background: #000; transform: translateX(-50%); z-index: 5; }
@media (max-width: 440px) {
  .device { width: 100%; height: 760px; padding: 0; border-radius: 30px; background: transparent; box-shadow: none; }
  .screen { border-radius: 30px; border: 1px solid var(--line); }
  .island { display: none; }
}
.view { position: absolute; inset: 50px 0 0; display: flex; flex-direction: column; }
.view[hidden] { display: none !important; }

/* 공통 세션 상단 */
.sbar { display: flex; align-items: center; gap: 12px; padding: 6px 20px 10px; }
.x { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; color: var(--text2); font-size: 15px; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 3px; background: var(--primary); transition: width calc(420ms * var(--slow)) var(--spring); }
.count { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

/* 플래시카드 */
.stage { position: relative; flex: 1; margin: 6px 22px 0; }
.card { position: absolute; inset: 0 0 18px; perspective: 1200px; transition: transform calc(380ms * var(--slow)) var(--spring), opacity calc(300ms * var(--slow)) var(--ease); touch-action: none; user-select: none; -webkit-user-select: none; }
.card.p1, .card.p2, .card.p3 { transform-origin: 50% 100%; }
.card.p1 { transform: translateY(10px) scale(.94); opacity: .6; }
.card.p2 { transform: translateY(20px) scale(.88); opacity: .3; }
.card.p3 { transform: translateY(26px) scale(.84); opacity: 0; }
.card.dragging { transition: none; }
.card.flyout { transition: transform calc(280ms * var(--slow)) cubic-bezier(.4, 0, .9, .6), opacity calc(260ms * var(--slow)) ease-in; transform: translateY(-115%) rotate(-4deg); opacity: 0; }
.inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform calc(420ms * var(--slow)) var(--ease); }
.card.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.front { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; cursor: grab; }
.back { transform: rotateY(180deg); display: flex; flex-direction: column; }
.pos { display: flex; gap: 6px; margin-bottom: 16px; }
.badge { padding: 3px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700; background: #E0F2FE; color: #075985; }
.badge.v { background: #D1FAE5; color: #065F46; }
.badge.a { background: #FEF3C7; color: #92400E; }
:root[data-theme="dark"] .badge { background: #0C2A3D; color: #7DD3FC; } :root[data-theme="dark"] .badge.v { background: #082E22; color: #6EE7B7; } :root[data-theme="dark"] .badge.a { background: #33240A; color: #FCD34D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { background: #0C2A3D; color: #7DD3FC; } :root:not([data-theme="light"]) .badge.v { background: #082E22; color: #6EE7B7; } :root:not([data-theme="light"]) .badge.a { background: #33240A; color: #FCD34D; } }
.word { font-size: 46px; font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.ipa { margin-top: 12px; font-size: 17px; color: var(--muted); }
.again { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 99px; background: var(--warning-soft); color: var(--warning); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.card.p0 .again { animation: blink calc(900ms * var(--slow)) var(--ease) 1; }
@keyframes blink { 0%, 100% { opacity: 1; } 35% { opacity: .25; } 70% { opacity: 1; } }
.tint { position: absolute; inset: 0; border-radius: 26px; opacity: 0; pointer-events: none; }
.stamp { position: absolute; top: 26px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 12px; font-size: 20px; font-weight: 800; opacity: 0; transform: scale(.8) rotate(var(--r)); pointer-events: none; }
.stamp.know { left: 22px; color: var(--success); --r: -12deg; }
.stamp.dont { right: 22px; color: var(--danger); --r: 12deg; }
.stamp.hit { animation: thump calc(240ms * var(--slow)) var(--spring); }
@keyframes thump { 50% { transform: scale(1.18) rotate(var(--r)); } }
.verdict { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 18px; font-size: 13px; font-weight: 700; }
.verdict.ok { background: var(--success-soft); color: var(--success); }
.verdict.ng { background: var(--danger-soft); color: var(--danger); }
.verdict button { font-size: 12.5px; font-weight: 600; opacity: .8; }
.backbody { flex: 1; overflow: auto; padding: 18px 20px 20px; display: grid; gap: 14px; align-content: start; }
.bword { display: flex; align-items: baseline; gap: 8px; font-size: 15px; color: var(--muted); }
.bword b { font-size: 22px; color: var(--text); letter-spacing: -.01em; }
.short { font-size: 23px; font-weight: 800; color: var(--primary-text); line-height: 1.3; }
.senses { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14.5px; }
.senses li { display: flex; gap: 10px; }
.senses span { width: 14px; text-align: right; color: var(--muted); font-weight: 700; font-size: 12px; padding-top: 2px; }
.label { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.ctx { padding: 12px 14px; border-radius: 14px; background: var(--surface2); display: grid; gap: 6px; }
.ctx .sense { font-size: 12.5px; font-weight: 700; color: var(--primary-text); }
.ctx .en { font-size: 15px; line-height: 1.5; }
.ctx .ko { font-size: 13px; line-height: 1.5; color: var(--text2); }
.ctx .src { font-size: 11px; color: var(--muted); }
mark { color: var(--marker-text); font-weight: 700; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 85% / 0% 70%; padding: 0 2px; border-radius: 3px; }
.card.flipped mark, .explain mark, .qcard mark { animation: sweep calc(420ms * var(--slow)) var(--ease) forwards; animation-delay: calc(var(--d, 380ms) * var(--slow)); }
@keyframes sweep { to { background-size: 100% 70%; } }

.actions { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 22px 30px; }
.btn { height: 56px; border-radius: 16px; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform calc(160ms * var(--slow)) var(--spring), background .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.ng { background: var(--danger-soft); color: var(--danger); }
.btn.ok { background: var(--success-soft); color: var(--success); }
.btn.go { grid-column: 1 / -1; background: var(--primary); color: var(--on-primary); }
.btn small { font-size: 12px; opacity: .7; font-weight: 600; }
.hint { text-align: center; font-size: 12px; color: var(--muted); padding: 0 0 4px; }
.chip { position: absolute; z-index: 20; padding: 6px 12px; border-radius: 99px; background: var(--warning); color: #fff; font-size: 12.5px; font-weight: 700; pointer-events: none; white-space: nowrap; }

/* 요약 */
.summary { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bgc { fill: none; stroke: var(--line); stroke-width: 12; }
.ring .fgc { fill: none; stroke: var(--primary); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.stats3 div { padding: 12px 6px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.stats3 b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 11.5px; color: var(--muted); }

/* 객관식 */
.qbody { flex: 1; overflow: auto; padding: 4px 20px 24px; display: grid; gap: 12px; align-content: start; }
.qcard { padding: 22px 18px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); animation: slideIn calc(260ms * var(--slow)) var(--ease) both; }
.qcard.center { text-align: center; padding: 30px 18px; }
.qlabel { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.qsent { font-size: 17px; line-height: 1.55; }
@keyframes slideIn { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
.opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: left; overflow: hidden; animation: up calc(280ms * var(--slow)) var(--ease) both; animation-delay: calc(var(--i) * 30ms * var(--slow) + 120ms * var(--slow)); transition: opacity .25s, transform calc(160ms * var(--slow)) var(--spring); }
.opt:active { transform: scale(.98); }
@keyframes up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.opt::before { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; transition: transform calc(240ms * var(--slow)) var(--ease); }
.opt.right::before { background: var(--success-soft); transform: scaleX(1); }
.opt.wrong::before { background: var(--danger-soft); transform: scaleX(1); }
.opt > * { position: relative; }
.num2 { width: 28px; height: 28px; flex: none; border-radius: 9px; background: var(--surface2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
.opt.right .num2 { background: var(--success); color: #fff; animation: pop calc(320ms * var(--slow)) var(--spring); }
.opt.wrong .num2 { background: var(--danger); color: #fff; }
.opt .t { flex: 1; font-size: 15.5px; font-weight: 600; }
.opt .owner { font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .3s; }
.answered .opt .owner { opacity: 1; }
.answered .opt:not(.right):not(.wrong) { opacity: .5; }
.opt.shake { animation: shake calc(300ms * var(--slow)) linear; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-8px); } 35% { transform: translateX(8px); } 55% { transform: translateX(-6px); } 75% { transform: translateX(5px); } }
.explain { display: grid; gap: 10px; padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); animation: rise calc(420ms * var(--slow)) var(--spring) both; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.result { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; }
.result.ok { background: var(--success-soft); color: var(--success); }
.result.ng { background: var(--danger-soft); color: var(--danger); }

/* 오늘 */
.home { flex: 1; overflow: auto; padding: 0 18px 28px; display: grid; gap: 14px; align-content: start; }
.lt { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 4px 0; }
.lt h2 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
.lt p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.gear { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--text2); }
.hero { padding: 20px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, #4F46E5, #7C3AED); box-shadow: 0 14px 30px rgb(79 70 229 / .35); display: grid; gap: 14px; }
.hero h3 { margin: 0; font-size: 15px; opacity: .9; }
.hero .nums { display: flex; gap: 26px; }
.hero .nums b { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hero .nums span { display: block; font-size: 13px; opacity: .85; }
.hero button { height: 48px; border-radius: 14px; background: rgb(255 255 255 / .18); color: #fff; font-weight: 700; font-size: 16px; transition: transform calc(160ms * var(--slow)) var(--spring), background .2s; }
.hero button:active { transform: scale(.97); background: rgb(255 255 255 / .26); }
.panel { padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.prog { display: flex; align-items: center; gap: 16px; }
.mini { width: 74px; height: 74px; flex: none; position: relative; }
.mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mini .bgc { fill: none; stroke: var(--line); stroke-width: 9; }
.mini .fgc { fill: none; stroke: var(--success); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 201; stroke-dashoffset: 201; }
.mini b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 4px; font-size: 13px; color: var(--text2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: left; display: grid; gap: 8px; animation: up calc(380ms * var(--slow)) var(--spring) both; animation-delay: calc(var(--i) * 40ms * var(--slow) + 200ms * var(--slow)); transition: transform calc(160ms * var(--slow)) var(--spring); }
.tile:active { transform: scale(.97); }
.tile .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: var(--primary-soft); color: var(--primary); }
.tile b { font-size: 15px; }
.tile span { font-size: 12px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 100px; margin-top: 10px; }
.bars div { flex: 1; display: grid; justify-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.bars i { width: 100%; max-width: 26px; border-radius: 7px 7px 3px 3px; background: var(--primary); opacity: .45; transform-origin: bottom; transform: scaleY(0); transition: transform calc(520ms * var(--slow)) var(--spring); transition-delay: calc(var(--i) * 40ms * var(--slow)); }
.bars div:last-child i { opacity: 1; }
.home.go .bars i { transform: scaleY(1); }

/* 명세 패널 */
.spec { display: grid; gap: 14px; min-width: 0; }
.spec h2 { margin: 0; font-size: 18px; }
.spec .lead { margin: 0; color: var(--text2); font-size: 14px; line-height: 1.6; max-width: 62ch; }
.rows { display: grid; gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); box-shadow: var(--shadow); }
.rows div { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; padding: 12px 16px; background: var(--surface); font-size: 13.5px; line-height: 1.55; }
.rows div b { font-weight: 700; }
.rows code { font-family: var(--mono); font-size: 12px; background: var(--surface2); padding: 1px 5px; border-radius: 5px; }

.tip { font-size: 13px; color: var(--muted); }

/* 동작 줄이기 미리보기 */
.reduced .card, .reduced .inner, .reduced .fill, .reduced .bars i { transition-duration: 1ms !important; }
.reduced .card.flipped .inner { transform: none; }

</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Quiz Word iOS 모션 시안</h1>
      <p>iPhone 앱에 들어갈 핵심 모션을 미리 만져 보는 시안입니다. 카드는 좌우로 쓸거나 버튼을 누르고, 뒷면은 위로 쓸거나 [다음]을 누르세요. 실제 앱은 이 동작을 Reanimated 로 똑같이 옮깁니다.</p>
    </div>

      showFlashSummary();
    }
    await wait(120);
    el.remove();
    busy = false;
  }

  function flyChip(fromEl) {
    const scr = $('#screen').getBoundingClientRect();
    const a = fromEl.getBoundingClientRect();
    const b = $('#f-count').getBoundingClientRect();
    const chip = html('<span class="chip">+3장 뒤 다시</span>');
    $('#screen').append(chip);
    const x0 = a.left - scr.left + a.width / 2 - 50, y0 = a.top - scr.top + a.height / 2;
    const x1 = b.left - scr.left - 40, y1 = b.top - scr.top;
    chip.animate(
      [{ transform: `translate(${x0}px, ${y0}px) scale(1)`, opacity: 1 }, { transform: `translate(${x0}px, ${y0 - 30}px) scale(1.05)`, opacity: 1, offset: 0.3 }, { transform: `translate(${x1}px, ${y1}px) scale(.5)`, opacity: 0 }],
      { duration: (isReduced() ? 1 : 560) * S, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' },
    ).onfinish = () => chip.remove();
    chip.style.left = '0'; chip.style.top = '0';
  }

  function countUp(el, to, ms) {
    if (isReduced()) { el.textContent = String(to); return; }
    const t0 = performance.now(), dur = ms * S;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function ring(circle, pct, ms, C) {
    circle.style.transition = 'none';
    circle.style.strokeDashoffset = String(C);
    circle.getBoundingClientRect();
    circle.style.transition = `stroke-dashoffset ${(isReduced() ? 1 : ms) * S}ms cubic-bezier(.2,.8,.2,1)`;
    circle.style.strokeDashoffset = String(C * (1 - pct));
  }

  function showFlashSummary() {
    const total = Object.keys(first).length;
    const knownN = Object.values(first).filter(Boolean).length;
    $('#f-fill').style.width = '100%';
    $('#f-count').textContent = `${total}/${total}`;
    stage.innerHTML = `<div class="summary">
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="54"/><circle class="fgc" cx="60" cy="60" r="54"/></svg><div class="num"><span id="sum-n">0</span>%</div></div>
      <div><b style="font-size:22px">끝까지 봤어요</b><div style="color:var(--muted);font-size:14px;margin-top:4px">바로 안 단어 비율</div></div>
      <div class="stats3"><div><b>${total}</b><span>전체</span></div><div><b style="color:var(--success)">${knownN}</b><span>바로 앎</span></div><div><b style="color:var(--danger)">${total - knownN}</b><span>모름</span></div></div>
    </div>`;
    stage.firstElementChild.style.position = 'absolute';
    stage.firstElementChild.style.inset = '0';
    actions.innerHTML = '<button class="btn go" id="b-again">처음부터 다시</button>';
    $('#b-again').onclick = resetFlash;
    $('#f-hint').textContent = '';
    navigator.vibrate?.(20);
    const pct = total ? knownN / total : 0;
    requestAnimationFrame(() => { ring($('.fgc', stage), pct, 900, 339.3); countUp($('#sum-n'), Math.round(pct * 100), 900); });
  }

  /* ───────── 객관식 ───────── */
  let qi = 0, qOk = 0;
  const qbody = $('#qbody');
  function renderQuiz() {
    $('#q-count').textContent = `${Math.min(qi + 1, QUIZ.length)}/${QUIZ.length}`;
    $('#q-fill').style.width = (qi / QUIZ.length) * 100 + '%';
    if (qi >= QUIZ.length) return quizSummary();
    const q = QUIZ[qi];
    const prompt = q.mode === 'context'
      ? `<div class="qcard"><div class="qlabel">이 문장에서 <b style="color:var(--text)">${esc(q.surface)}</b> 의 뜻은?</div><div class="qsent">${markup(q.en, q.surface)}</div></div>`
      : `<div class="qcard center"><div class="pos" style="justify-content:center">${q.pos.map((p) => `<span class="badge ${posClass(p)}">${p}</span>`).join('')}</div><div class="word">${esc(q.word)}</div><div class="ipa">/${esc(q.ipa)}/ 🔊</div></div>`;
    qbody.innerHTML = prompt + `<div id="opts" style="display:grid;gap:10px">${q.options.map(([t, owner], i) => `<button class="opt" style="--i:${i}" data-i="${i}"><span class="num2">${i + 1}</span><span class="t">${esc(t)}</span><span class="owner">${owner && owner !== q.word ? esc(owner) : ''}</span></button>`).join('')}</div>`;
    $('.qcard mark', qbody)?.style.setProperty('--d', '200ms');
    qbody.querySelectorAll('.opt').forEach((b) => (b.onclick = () => choose(Number(b.dataset.i))));
    qbody.scrollTop = 0;
  }
  async function choose(i) {
    const q = QUIZ[qi];
    const opts = $('#opts');
    if (opts.classList.contains('answered')) return;
    opts.classList.add('answered');
    const btns = [...opts.children];
    const correct = q.options.findIndex((o) => o[2]);
    const ok = i === correct;
    if (ok) {
      qOk++;
      btns[i].classList.add('right');
      $('.num2', btns[i]).textContent = '✓';
      navigator.vibrate?.(12);
    } else {
      btns[i].classList.add('wrong', 'shake');
      $('.num2', btns[i]).textContent = '✕';
      navigator.vibrate?.([10, 40, 10, 40, 10]);
      await wait(120);
      btns[correct].classList.add('right');
      $('.num2', btns[correct]).textContent = '✓';
    }
    $('#q-fill').style.width = ((qi + 1) / QUIZ.length) * 100 + '%';
    await wait(160);
    const exp = html(`<div class="explain">
      <div class="result ${ok ? 'ok' : 'ng'}">${ok ? '✓ 정답이에요' : '✕ 틀렸어요 — 오답노트에 담았어요'}</div>
      <div class="short">${esc(q.options[correct][0])}</div>
      ${q.mode === 'context' ? `<div class="ctx"><div class="en">${markup(q.en, q.surface)}</div><div class="ko">${esc(q.ko)}</div></div>` : ''}
      <button class="btn go" id="q-next">${qi + 1 < QUIZ.length ? '다음 문제' : '결과 보기'}</button>
    </div>`);
    qbody.append(exp);
    $('.explain mark', qbody)?.style.setProperty('--d', '250ms');
    $('#q-next').onclick = () => { qi++; renderQuiz(); };
    setTimeout(() => qbody.scrollTo({ top: qbody.scrollHeight, behavior: isReduced() ? 'auto' : 'smooth' }), 60 * S);
  }
  function quizSummary() {
    $('#q-count').textContent = `${QUIZ.length}/${QUIZ.length}`;
    $('#q-fill').style.width = '100%';
    const pct = qOk / QUIZ.length;
    qbody.innerHTML = `<div class="summary" style="min-height:560px">
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="54"/><circle class="fgc" cx="60" cy="60" r="54"/></svg><div class="num"><span id="qs-n">0</span>점</div></div>
      <div><b style="font-size:22px">${QUIZ.length}문제 중 ${qOk}개 맞힘</b><div style="color:var(--muted);font-size:14px;margin-top:4px">틀린 단어는 오답노트에 담겼어요</div></div>
      <button class="btn go" id="q-again" style="width:100%">다시 풀기</button>
    </div>`;
    $('#q-again').onclick = () => { qi = 0; qOk = 0; renderQuiz(); };
    requestAnimationFrame(() => { ring($('.fgc', qbody), pct, 900, 339.3); countUp($('#qs-n'), Math.round(pct * 100), 900); });
  }

  /* ───────── 오늘 ───────── */
  function renderHome() {
    const home = $('#home');
    home.classList.remove('go');
    const week = [['화', 32], ['수', 18], ['목', 45], ['금', 26], ['토', 52], ['일', 40], ['오늘', 61]];
    const max = 61;
    home.innerHTML = `
      <div class="lt"><div><h2>오늘</h2><p>11월 9일 월요일 · 시험 D-12</p></div><button class="gear" aria-label="설정">⚙</button></div>
      <div class="hero"><h3>오늘의 복습</h3>
        <div class="nums"><div><b id="h-due">0</b><span>복습할 단어</span></div><div><b id="h-new">0</b><span>새 단어</span></div></div>
        <button type="button" id="h-start">복습 시작 ▶</button></div>
      <div class="panel prog"><div class="mini"><svg viewBox="0 0 74 74"><circle class="bgc" cx="37" cy="37" r="32"/><circle class="fgc" cx="37" cy="37" r="32"/></svg><b><span id="h-pct">0</span>%</b></div>
        <div class="legend"><b style="font-size:15px;color:var(--text)">핵심 단어 1,898개</b><span><i style="background:var(--success)"></i>익힘 612</span><span><i style="background:var(--warning)"></i>학습 중 210</span><span><i style="background:var(--line)"></i>새 단어 1,076</span></div></div>
      <div class="tiles">
        <button class="tile" style="--i:0"><span class="ic">▤</span><b>플래시카드</b><span>못 익힌 단어 20개</span></button>
        <button class="tile" style="--i:1"><span class="ic">≡</span><b>객관식</b><span>단어 → 뜻</span></button>
        <button class="tile" style="--i:2"><span class="ic">“</span><b>문맥 뜻</b><span>다의어 연습</span></button>
        <button class="tile" style="--i:3"><span class="ic" style="background:var(--danger-soft);color:var(--danger)">!</span><b>오답 복습</b><span>5개</span></button>
      </div>
      <div class="panel"><div class="label">최근 7일</div><div class="bars">${week.map(([d, n], i) => `<div><span>${n}</span><i style="--i:${i};height:${(n / max) * 70}px"></i><span>${d}</span></div>`).join('')}</div></div>`;
    $('#h-start').onclick = () => setTab('flash');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      home.classList.add('go');
      countUp($('#h-due'), 23, 600);
      countUp($('#h-new'), 30, 600);
      countUp($('#h-pct'), 32, 800);
      ring($('.mini .fgc', home), 0.32, 800, 201);
    }));
  }

  /* ───────── 탭·토글 ───────── */
  function setTab(tab) {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
    ['flash', 'quiz', 'home'].forEach((t) => ($('#v-' + t).hidden = t !== tab));
    renderSpec(tab);
    if (tab === 'flash') resetFlash();
    if (tab === 'quiz') { qi = 0; qOk = 0; renderQuiz(); }
    if (tab === 'home') renderHome();
    try { localStorage.setItem('qw-proto-tab', tab); } catch {}
  }
  document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  $('#slow').onclick = (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    S = on ? 2 : 1;
    root.style.setProperty('--slow', String(S));
  };
  const setReduced = (on) => { root.classList.toggle('reduced', on); $('#reduce').setAttribute('aria-pressed', String(on)); };
  $('#reduce').onclick = (e) => setReduced(e.currentTarget.getAttribute('aria-pressed') !== 'true');
  setReduced(reducedMedia.matches);

  document.addEventListener('keydown', (e) => {
    if ($('#v-flash').hidden) return;
    if (e.key === 'ArrowLeft') commit(false, true);
    else if (e.key === 'ArrowRight') commit(true, true);
    else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); next(); }
  });

  let start = 'flash';
  try { start = localStorage.getItem('qw-proto-tab') || 'flash'; } catch {}
  setTab(['flash', 'quiz', 'home'].includes(start) ? start : 'flash');
})();
</script>
