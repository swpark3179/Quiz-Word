# Release 워크플로 — 안드로이드 앱(mobile/) 빌드 → GitHub Release 에 apk · aab 첨부 (+ 선택: Play 내부 테스트 업로드)
# Actions 탭 → Release → Run workflow 에서 버전 증가 기준(major / minor / patch)을 골라 실행합니다.
# 앱 버전은 iOS · 안드로이드 공통(mobile/app-version.json)이고, 버전을 올리는 곳은 이 워크플로뿐입니다.
# 빌드하는 것은 안드로이드뿐 — iOS 는 이 실행이 끝난 뒤 iOS TestFlight(ios-testflight.yml)를 돌리면 같은 버전으로 빌드됩니다.
# 빌드 번호는 플랫폼별로 따로입니다 (안드로이드 versionCode 는 이 파일에서 +1, iOS 는 iOS 워크플로의 실행 번호).
#
# 동작 순서
#   1. 기존 Release 페이지에서 가장 높은 버전 확인 (릴리즈가 없거나 버전을 알 수 없으면 1.0.0)
#   2. 증가 기준에 따라 다음 버전 확정
#   3. 설정 파일에 버전 반영 후 빌드
#   4. 버전 변경을 기본 브랜치에 커밋·푸시
#   5. 4번 커밋에 태그를 달고 Release 페이지 생성 (이전 버전 이후 PR 목록 + 빌드 결과물 첨부)
#   6. (upload_play 를 켰을 때만) aab 를 Play Console 내부 테스트 트랙에 업로드
#
# 릴리즈 빌드는 R8 로 줄이고 난독화한다 (app.config.ts 의 expo-build-properties).
# R8 의 가독화 파일(mapping.txt)은 aab 안(BUNDLE-METADATA)에 들어가 Play Console 이 업로드 때 알아서 가져간다 —
# 워크플로로 올리든 Play Console 에 직접 올리든 따로 올릴 파일이 없다. 3-2 의 '가독화 파일 확인' 단계가 aab 에 들었는지 본다.
#
# 필요한 시크릿
#   RELEASE_TOKEN (선택) : 기본 브랜치에 보호 규칙이 있어 기본 토큰으로 푸시가 막힐 때만 등록
#   ANDROID_KEYSTORE_BASE64   : 업로드 키스토어(.jks) 파일의 base64
#   ANDROID_KEYSTORE_PASSWORD : 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         : 키 별칭
#   ANDROID_KEY_PASSWORD      : 키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON (upload_play 를 켤 때만) : Play Console 에 권한을 준 서비스 계정 키(JSON 원문)
# 저장소 변수 (선택)
#   PLAY_RELEASE_STATUS : Play 업로드 상태. 기본 draft (Play Console 에서 직접 출시 버튼을 누름).
#                         앱이 한 번 검토를 통과한 뒤에는 completed 로 바꾸면 올리자마자 테스터에게 나간다.
# 처음 설정하는 법: mobile/README.md 의 "안드로이드" 절

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "버전 증가 기준 (major: 1.3.4→2.0.0, minor: 1.3.4→1.4.0, patch: 1.3.4→1.3.5)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch
      upload_play:
        description: "aab 를 Play Console 내부 테스트 트랙에도 올리기"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # 서명 시크릿이 빠졌을 때 진단 단계가 Environment 이름을 조회한다

# 두 번 연달아 실행해도 같은 버전을 동시에 계산하지 않도록 한 번에 하나씩만 실행
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        # 앱은 저장소의 mobile/ 폴더에 있다 — 모든 run 단계가 그 폴더 기준으로 실행된다
        working-directory: mobile
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APP_NAME: ${{ github.event.repository.name }}
      ANDROID_PACKAGE: com.swpark3179.quizword2

    steps:
      - name: 기본 브랜치에서 실행했는지 확인
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Release는 기본 브랜치(${DEFAULT_BRANCH})에서만 실행할 수 있습니다. 현재: ${GITHUB_REF_NAME}"
          exit 1

      - name: 저장소 체크아웃
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # ───────── 1~2. 이전 릴리즈 확인 및 다음 버전 확정 ─────────
      - name: "1~2. 이전 릴리즈 확인 및 다음 버전 확정"
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Release 페이지의 태그 중 x.y.z 또는 vx.y.z 형식만 골라 가장 높은 버전을 찾는다.
          # 릴리즈가 없거나 버전 형식의 태그가 하나도 없으면 '기존 버전 확인 불가'로 보고 1.0.0부터 시작한다.
          TAGS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
                   --json tagName --jq '.[].tagName')
          LATEST=$(printf '%s\n' "$TAGS" \
                   | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                   | awk '{ v = $0; sub(/^v/, "", v); print v, $0 }' \
                   | sort -V | tail -n 1 || true)

          if [ -z "$LATEST" ]; then
            echo "확인 가능한 이전 릴리즈가 없어 1.0.0으로 시작합니다."
            NEXT="1.0.0"
            PREV_TAG=""
            PREFIX="v"
          else
            PREV_VERSION="${LATEST%% *}"
            PREV_TAG="${LATEST##* }"
            PREFIX="${PREV_TAG%%[0-9]*}"   # 기존 태그가 v를 붙였는지 여부를 그대로 따른다
            IFS=. read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
            # 10# : 01 같은 값이 8진수로 해석되지 않게 10진수로 고정
            MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))
            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "::error::알 수 없는 증가 기준: ${BUMP}"; exit 1 ;;
            esac
            echo "이전 버전 ${PREV_TAG} → 다음 버전 ${NEXT} (${BUMP})"
          fi
          TAG="${PREFIX}${NEXT}"

          # 같은 이름의 태그가 이미 있으면 Release를 만들 수 없으므로 오래 걸리는 빌드 전에 멈춘다
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::태그 ${TAG} 가 이미 존재합니다. 태그를 정리한 뒤 다시 실행하세요."
            exit 1
          fi

          {
            echo "VERSION=${NEXT}"
            echo "TAG=${TAG}"
            echo "PREV_TAG=${PREV_TAG}"
          } >> "$GITHUB_ENV"

      # ───────── 3. 설정 파일에 버전 반영 및 빌드 (프레임워크별) ─────────
      - name: Node 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Java 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 의존성·빌드 캐시를 실행 사이에 재사용한다
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v5

      - name: Gradle 메모리 늘리기
        run: |
          # Expo prebuild 가 만드는 android/gradle.properties 는 Gradle 메모리를 -Xmx2048m -XX:MaxMetaspaceSize=512m 로 잡는데,
          # 모듈이 많은 이 프로젝트는 그 한도를 넘겨 OutOfMemoryError: Metaspace 로 빌드가 끝나지 않고 멈춘다.
          # 사용자 홈의 gradle.properties 는 프로젝트 것보다 우선하고 저장소 밖이라 커밋에 섞이지 않는다.
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      # iOS 워크플로(ios-testflight.yml)의 check 잡과 같은 검사 — 통과해야 빌드한다
      - name: 공용 로직 테스트 · 데이터 검사
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npx vitest run
          npm run data:validate

      - name: 의존성 설치 (공용 로직·단어 데이터는 postinstall 이 복사)
        run: npm ci

      - name: 타입 검사 · 린트
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: "3-1. 설정 파일에 버전 반영 (app-version.json)"
        run: |
          set -euo pipefail
          # app.config.ts 가 이 파일에서 앱 버전(iOS · 안드로이드 공통)과 안드로이드 versionCode 를 읽는다. versionCode 는 릴리즈마다 1 씩 늘린다.
          node <<'JS'
          const fs = require('fs');
          const p = 'app-version.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.version = process.env.VERSION;
          json.versionCode = (Number(json.versionCode) || 0) + 1;
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          console.log(`app-version.json: ${json.version} (versionCode ${json.versionCode})`);
          JS
          echo "VERSION_FILES=app-version.json" >> "$GITHUB_ENV"

      - name: "3-2. Android 서명 키 준비"
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 빈 값으로 들어온 시크릿을 '시크릿 이름'으로 짚어 준다 (환경 변수 이름과 달라서 그대로 찍으면 헷갈린다)
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ]       || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ]               || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ]            || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"   # 다음 단계(빠진 서명 시크릿 진단)가 읽는다
            echo "::error::이 실행에 전달되지 않은 서명 시크릿: ${missing[*]} — 서명 없이 만든 apk/aab 는 배포할 수 없어 중단합니다."
            echo "확인할 것 (mobile/README.md '처음 한 번만 할 일 — 서명 키'):"
            echo "  - Settings → Secrets and variables → Actions → Secrets 탭의 'Repository secrets' 에 있어야 합니다."
            echo "    Variables 탭 · Environment secrets · Dependabot/Codespaces secrets 에 넣은 값은 이 워크플로에 전달되지 않습니다."
            echo "  - 이름이 한 글자도 다르지 않아야 합니다 (예: ANDROID_KEYSTORE_BASE_64 · ANDROID_KEYSTORE 는 다른 시크릿)."
            echo "  - 이 실행이 실제로 받은 시크릿 이름은 다음 단계 '3-2. 빠진 서명 시크릿 진단' 에 찍힙니다."
            exit 1
          fi

          # 키스토어는 저장소 밖에 풀어서 커밋 단계에 섞여 들어가지 않게 한다.
          # 줄바꿈(Windows 의 CRLF 포함)·공백과 certutil -encode 가 붙이는 -----BEGIN/END----- 줄은 걷어내고 푼다.
          KEYSTORE_PATH="${RUNNER_TEMP}/upload-keystore.jks"
          if ! printf '%s\n' "$ANDROID_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d '[:space:]' \
               | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 를 base64 로 풀 수 없습니다. 키스토어(.jks) 파일 전체를 base64 로 바꾼 문자열을 그대로 넣으세요 (mobile/README.md 의 PowerShell 명령)."
            exit 1
          fi

          # 오래 걸리는 Gradle 빌드 전에 키스토어 · 비밀번호 · 별칭이 서로 맞는지 확인한다.
          # Gradle 서명과 같은 방식(KeyStore 로 열고 별칭의 키를 키 비밀번호로 꺼냄)이라, 여기를 통과하면 서명 단계에서 막히지 않는다.
          # keytool 은 PKCS12 키스토어에서 키 비밀번호를 검사하지 않아서 직접 확인한다. 비밀번호는 환경 변수로만 넘긴다.
          cat > "${RUNNER_TEMP}/CheckKeystore.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;
          import java.util.Collections;

          public class CheckKeystore {
            public static void main(String[] args) {
              String alias = System.getenv("KEY_ALIAS");
              KeyStore ks;
              try {
                ks = KeyStore.getInstance(new File(args[0]), System.getenv("KEYSTORE_PASSWORD").toCharArray());
              } catch (Exception e) {
                System.out.println("keystore: " + e);
                System.exit(2);
                return;
              }
              try {
                if (!ks.isKeyEntry(alias)) {
                  System.out.println("aliases in keystore: " + String.join(", ", Collections.list(ks.aliases())));
                  System.exit(3);
                }
                ks.getKey(alias, System.getenv("KEY_PASSWORD").toCharArray());
              } catch (Exception e) {
                System.out.println("key: " + e);
                System.exit(4);
              }
            }
          }
          JAVA
          rc=0
          java "${RUNNER_TEMP}/CheckKeystore.java" "$KEYSTORE_PATH" || rc=$?
          case $rc in
            0) echo "서명 키 확인 완료" ;;
            2) echo "::error::키스토어를 열 수 없습니다 — ANDROID_KEYSTORE_PASSWORD 가 틀렸거나, ANDROID_KEYSTORE_BASE64 가 키스토어(.jks) 파일 전체의 base64 가 아닙니다." ;;
            3) echo "::error::키스토어에 ANDROID_KEY_ALIAS 별칭의 키가 없습니다. 위에 찍힌 별칭 중 하나로 시크릿을 고치세요." ;;
            4) echo "::error::ANDROID_KEY_PASSWORD 로 키를 꺼낼 수 없습니다. keytool 기본값(PKCS12)으로 만든 키스토어는 키 비밀번호가 키스토어 비밀번호와 같습니다." ;;
            *) echo "::error::서명 키를 확인하다 알 수 없는 오류가 났습니다 (exit ${rc})." ;;
          esac
          [ "$rc" -eq 0 ] || exit 1
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      # 서명 시크릿이 빈 값으로 들어와 위 단계가 멈췄을 때만 실행된다.
      # 저장소의 시크릿 목록은 GITHUB_TOKEN 으로 조회할 수 없어서, 이 실행이 실제로 받은 시크릿을 toJSON 으로 넘겨
      # '이름'만 찍는다 (값은 로그에서 *** 로 가려지고, 스크립트도 값을 찍지 않는다).
      # 변수(Variables)는 값이 로그에 그대로 보이므로 통째로 넘기지 않고, 서명 시크릿 이름으로 들어 있는지만 넘긴다.
      - name: "3-2. 빠진 서명 시크릿 진단"
        if: failure() && steps.signing.outputs.missing != ''
        env:
          MISSING: ${{ steps.signing.outputs.missing }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          IN_VARIABLES: >-
            ${{ vars.ANDROID_KEYSTORE_BASE64 != '' && 'ANDROID_KEYSTORE_BASE64' || '' }}
            ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' && 'ANDROID_KEYSTORE_PASSWORD' || '' }}
            ${{ vars.ANDROID_KEY_ALIAS != '' && 'ANDROID_KEY_ALIAS' || '' }}
            ${{ vars.ANDROID_KEY_PASSWORD != '' && 'ANDROID_KEY_PASSWORD' || '' }}
        run: |
          python3 - <<'PY'
          import difflib, json, os, re, subprocess

          EXPECTED = ["ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
          missing = os.environ["MISSING"].split()
          secrets = {k.upper() for k in json.loads(os.environ.get("ALL_SECRETS") or "{}") if k.lower() != "github_token"}
          in_variables = set(os.environ.get("IN_VARIABLES", "").split())

          print("이 실행이 받은 Repository secrets 이름 (값은 찍지 않음):", ", ".join(sorted(secrets)) or "(없음)")

          # Environment 이름 (GITHUB_TOKEN 에 actions: read 가 있어야 보인다 — 안 보이면 건너뛴다)
          envs = []
          try:
              r = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/environments", "--jq", ".environments[].name"],
                                 capture_output=True, text=True, timeout=30)
              if r.returncode == 0:
                  envs = [e for e in r.stdout.splitlines() if e.strip()]
          except Exception:
              pass

          def norm(name):
              return re.sub(r"[^A-Z0-9]", "", name.upper())

          def looks_like(candidate, name):
              a, b = norm(candidate), norm(name)
              # _ 만 다르거나(ANDROID_KEYSTORE_BASE_64), 앞부분이 빠졌거나(KEY_ALIAS), 철자가 많이 겹치는 것
              return a == b or (len(a) >= 6 and b.endswith(a)) or difflib.SequenceMatcher(None, candidate, name).ratio() >= 0.75

          # 비슷한 이름 후보에서 제대로 들어온 서명 시크릿 이름은 뺀다
          pool = sorted(secrets - set(EXPECTED))
          for name in missing:
              if name in secrets:
                  msg = f"{name}: Repository secrets 에 이름은 있는데 값이 비어서 전달됐습니다. 그 시크릿의 Update 로 값을 다시 붙여 넣으세요."
              elif name in in_variables:
                  msg = (f"{name}: Secrets 탭이 아니라 Variables 탭에 들어 있습니다. "
                         f"Secrets 탭 → New repository secret 으로 같은 이름 · 값을 만들고 Variables 의 것은 지우세요.")
              else:
                  near = [n for n in pool if looks_like(n, name)]
                  if near:
                      msg = (f"{name}: 이 이름의 시크릿은 없고 비슷한 이름이 있습니다 — {', '.join(near)}. "
                             f"시크릿 이름은 바꿀 수 없으니 New repository secret 으로 이름이 {name} 인 시크릿을 새로 만들고 옛것은 지우세요.")
                  else:
                      msg = (f"{name}: Repository secrets 에도 Variables 에도 이 이름이 없습니다. "
                             f"Settings → Secrets and variables → Actions → Secrets 탭 → New repository secret 으로 등록하세요.")
                      if envs:
                          msg += (f" 이 저장소에는 Environment({', '.join(envs)}) 가 있습니다 — 거기 Environment secrets 에 넣었다면 "
                                  f"이 워크플로에는 전달되지 않으니 Repository secrets 로 다시 만드세요.")
              print(f"::error::{msg}")
          PY

      - name: "3-2. Expo prebuild (android 폴더 생성)"
        run: npx expo prebuild --platform android --no-install --clean

      - name: "3-2. 빌드 (apk, aab)"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # android 폴더는 매번 새로 만들어지므로(build.gradle 을 고칠 수 없음) 서명 정보를 Gradle 주입 속성으로 넘긴다.
          # 휴대폰용 ABI(arm)만 빌드한다 — x86 은 에뮬레이터용이라 뺀다.
          # 릴리즈 전용 린트(lintVital*)는 건너뛴다 — android 폴더는 생성물이라 잡아 줄 우리 코드가 없고, 메모리를 가장 많이 쓰는 단계다.
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD")

          mkdir -p release-assets
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::apk가 만들어지지 않았습니다."
            exit 1
          elif [ ${#apks[@]} -eq 1 ]; then
            cp "${apks[0]}" "release-assets/${APP_NAME}-${VERSION}.apk"
          else
            for a in "${apks[@]}"; do
              b=$(basename "$a" .apk)
              cp "$a" "release-assets/${APP_NAME}-${VERSION}-${b#app-}.apk"
            done
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/${APP_NAME}-${VERSION}.aab"

      - name: "3-2. 서명 확인 (디버그 키면 중단)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in release-assets/*.apk; do
            DN=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate DN' || true)
            echo "$apk → ${DN:-서명 정보 없음}"
            if [ -z "$DN" ] || grep -q 'CN=Android Debug' <<< "$DN"; then
              echo "::error::$apk 가 업로드 키로 서명되지 않았습니다 (서명 설정을 확인하세요)."
              exit 1
            fi
          done
          for aab in release-assets/*.aab; do
            OWNER=$(keytool -printcert -jarfile "$aab" | grep -m1 'Owner:' || true)
            echo "$aab → ${OWNER:-서명 정보 없음}"
            if [ -z "$OWNER" ] || grep -q 'CN=Android Debug' <<< "$OWNER"; then
              echo "::error::$aab 가 업로드 키로 서명되지 않았습니다 (서명 설정을 확인하세요)."
              exit 1
            fi
          done

      # R8 이 꺼진 채 빌드되면 aab 에 가독화 파일이 없어 Play Console 이 "가독화 파일이 없습니다" 경고를 다시 띄운다.
      # Release 를 만들기 전에 aab 안에 R8 매핑(mapping.txt 와 같은 내용)이 들었는지 본다.
      - name: "3-2. 가독화 파일 확인 (aab 에 R8 매핑이 없으면 중단)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          ENTRY=BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map
          for aab in release-assets/*.aab; do
            SIZE=$({ unzip -p "$aab" "$ENTRY" 2>/dev/null || true; } | wc -c)
            if [ "$SIZE" -eq 0 ]; then
              echo "::error::$aab 에 R8 가독화 파일($ENTRY)이 없습니다 — R8 이 꺼진 채 빌드됐습니다. app.config.ts 의 expo-build-properties(enableMinifyInReleaseBuilds)를 확인하세요."
              exit 1
            fi
            echo "$aab → 가독화 파일 ${SIZE} bytes"
          done

      - name: "3-3. 첨부할 빌드 결과물 확인"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::release-assets/ 에 빌드 결과물이 없습니다. 빌드 단계를 확인하세요."
            exit 1
          fi
          ls -la release-assets

      # ───────── 4. 버전 변경을 기본 브랜치에 커밋 ─────────
      - name: "4. 버전 변경을 기본 브랜치에 커밋"
        id: commit
        run: |
          set -euo pipefail
          if [ -z "${VERSION_FILES:-}" ]; then
            echo "::error::VERSION_FILES가 비어 있습니다. 3-1 단계에서 수정한 버전 파일 목록을 기록해야 합니다."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 버전 파일만 골라서 추가한다 (git add -A 금지).
          # 서명 키, key.properties, 빌드 결과물이 실수로 커밋되는 것을 막기 위해서다.
          for f in $VERSION_FILES; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "바뀐 버전 파일이 없어 커밋 없이 현재 커밋에 릴리즈합니다."
          else
            git commit -m "chore(release): ${TAG} [skip ci]"
            # 빌드 도중 기본 브랜치에 새 커밋이 들어왔다면 푸시가 거부되고 Release도 만들어지지 않는다.
            # 빌드한 코드와 태그가 가리키는 코드를 일치시키려는 의도된 동작이니, 그럴 땐 다시 실행하면 된다.
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ───────── 5. Release 페이지 생성 ─────────
      - name: "5. Release 페이지 생성 (PR 목록 + 빌드 결과물 첨부)"
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # --generate-notes: 이전 릴리즈 태그부터 이번 커밋까지 머지된 PR 목록을 GitHub가 본문에 작성한다
          ARGS=(--target "$TARGET_SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" release-assets/* "${ARGS[@]}"
          echo "### 🚀 ${TAG} 릴리즈 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "iOS 도 ${VERSION} 으로 내보내려면 Actions → **iOS TestFlight** → Run workflow (기본 브랜치)" >> "$GITHUB_STEP_SUMMARY"

      # ───────── 6. Play 내부 테스트 (선택) ─────────
      # Release 는 이미 만들어진 뒤다 — 여기서 실패해도 apk·aab 는 Release 페이지에 있으니, aab 를 Play Console 에 직접 올리면 된다.
      - name: "6. Play 업로드 시크릿 확인"
        if: ${{ inputs.upload_play }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없습니다. mobile/README.md 의 'Play 내부 테스트' 를 따라 등록하거나, Release 페이지의 aab 를 Play Console 에 직접 올리세요."
            exit 1
          fi
          # 파일 경로나 일부만 붙여 넣으면 업로드 액션이 알아보기 힘든 인증 오류로 멈추므로 먼저 확인한다 (값은 찍지 않는다)
          if ! jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | type == "string")' \
               <<< "$PLAY_SERVICE_ACCOUNT_JSON" > /dev/null 2>&1; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 이 서비스 계정 JSON 키가 아닙니다. Google Cloud 콘솔에서 내려받은 .json 파일의 내용 전체({ 부터 } 까지)를 그대로 넣으세요."
            exit 1
          fi

      # 가독화 파일은 aab 안에 들어 있어 Play 가 알아서 이 버전에 붙인다 (mappingFile 을 따로 넘기지 않는다)
      - name: "6. Play 내부 테스트 트랙에 업로드"
        if: ${{ inputs.upload_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: mobile/release-assets/*.aab
          releaseName: ${{ env.TAG }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
