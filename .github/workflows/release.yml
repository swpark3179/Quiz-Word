# Release 워크플로 — 안드로이드 앱(mobile/) 빌드 → GitHub Release 에 apk · aab 첨부 (+ 선택: Play 내부 테스트 업로드)
# Actions 탭 → Release → Run workflow 에서 버전 증가 기준(major / minor / patch)을 골라 실행합니다.
# iOS 는 이 워크플로와 상관없습니다 (ios-testflight.yml). 여기서 올리는 버전은 안드로이드 것(mobile/android-version.json)뿐입니다.
#
# 동작 순서
#   1. 기존 Release 페이지에서 가장 높은 버전 확인 (릴리즈가 없거나 버전을 알 수 없으면 1.0.0)
#   2. 증가 기준에 따라 다음 버전 확정
#   3. 설정 파일에 버전 반영 후 빌드
#   4. 버전 변경을 기본 브랜치에 커밋·푸시
#   5. 4번 커밋에 태그를 달고 Release 페이지 생성 (이전 버전 이후 PR 목록 + 빌드 결과물 첨부)
#   6. (upload_play 를 켰을 때만) aab 를 Play Console 내부 테스트 트랙에 업로드
#
# 필요한 시크릿
#   RELEASE_TOKEN (선택) : 기본 브랜치에 보호 규칙이 있어 기본 토큰으로 푸시가 막힐 때만 등록
#   ANDROID_KEYSTORE_BASE64   : 업로드 키스토어(.jks) 파일의 base64
#   ANDROID_KEYSTORE_PASSWORD : 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         : 키 별칭
#   ANDROID_KEY_PASSWORD      : 키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON (upload_play 를 켤 때만) : Play Console 에 권한을 준 서비스 계정 키(JSON 원문)
# 저장소 변수 (선택)
#   PLAY_RELEASE_STATUS : Play 업로드 상태. 기본 draft (Play Console 에서 직접 출시 버튼을 누름).
#                         앱이 한 번 검토를 통과한 뒤에는 completed 로 바꾸면 올리자마자 테스터에게 나간다.
# 처음 설정하는 법: mobile/README.md 의 "안드로이드" 절

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "버전 증가 기준 (major: 1.3.4→2.0.0, minor: 1.3.4→1.4.0, patch: 1.3.4→1.3.5)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch
      upload_play:
        description: "aab 를 Play Console 내부 테스트 트랙에도 올리기"
        type: boolean
        default: false

permissions:
  contents: write

# 두 번 연달아 실행해도 같은 버전을 동시에 계산하지 않도록 한 번에 하나씩만 실행
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        # 앱은 저장소의 mobile/ 폴더에 있다 — 모든 run 단계가 그 폴더 기준으로 실행된다
        working-directory: mobile
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APP_NAME: ${{ github.event.repository.name }}
      ANDROID_PACKAGE: com.swpark3179.quizword2

    steps:
      - name: 기본 브랜치에서 실행했는지 확인
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Release는 기본 브랜치(${DEFAULT_BRANCH})에서만 실행할 수 있습니다. 현재: ${GITHUB_REF_NAME}"
          exit 1

      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # ───────── 1~2. 이전 릴리즈 확인 및 다음 버전 확정 ─────────
      - name: "1~2. 이전 릴리즈 확인 및 다음 버전 확정"
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Release 페이지의 태그 중 x.y.z 또는 vx.y.z 형식만 골라 가장 높은 버전을 찾는다.
          # 릴리즈가 없거나 버전 형식의 태그가 하나도 없으면 '기존 버전 확인 불가'로 보고 1.0.0부터 시작한다.
          TAGS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
                   --json tagName --jq '.[].tagName')
          LATEST=$(printf '%s\n' "$TAGS" \
                   | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                   | awk '{ v = $0; sub(/^v/, "", v); print v, $0 }' \
                   | sort -V | tail -n 1 || true)

          if [ -z "$LATEST" ]; then
            echo "확인 가능한 이전 릴리즈가 없어 1.0.0으로 시작합니다."
            NEXT="1.0.0"
            PREV_TAG=""
            PREFIX="v"
          else
            PREV_VERSION="${LATEST%% *}"
            PREV_TAG="${LATEST##* }"
            PREFIX="${PREV_TAG%%[0-9]*}"   # 기존 태그가 v를 붙였는지 여부를 그대로 따른다
            IFS=. read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
            # 10# : 01 같은 값이 8진수로 해석되지 않게 10진수로 고정
            MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))
            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "::error::알 수 없는 증가 기준: ${BUMP}"; exit 1 ;;
            esac
            echo "이전 버전 ${PREV_TAG} → 다음 버전 ${NEXT} (${BUMP})"
          fi
          TAG="${PREFIX}${NEXT}"

          # 같은 이름의 태그가 이미 있으면 Release를 만들 수 없으므로 오래 걸리는 빌드 전에 멈춘다
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::태그 ${TAG} 가 이미 존재합니다. 태그를 정리한 뒤 다시 실행하세요."
            exit 1
          fi

          {
            echo "VERSION=${NEXT}"
            echo "TAG=${TAG}"
            echo "PREV_TAG=${PREV_TAG}"
          } >> "$GITHUB_ENV"

      # ───────── 3. 설정 파일에 버전 반영 및 빌드 (프레임워크별) ─────────
      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # iOS 워크플로(ios-testflight.yml)의 check 잡과 같은 검사 — 통과해야 빌드한다
      - name: 공용 로직 테스트 · 데이터 검사
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npx vitest run
          npm run data:validate

      - name: 의존성 설치 (공용 로직·단어 데이터는 postinstall 이 복사)
        run: npm ci

      - name: 타입 검사 · 린트
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: "3-1. 설정 파일에 버전 반영 (android-version.json)"
        run: |
          set -euo pipefail
          # app.config.ts 가 이 파일에서 안드로이드 버전 이름과 versionCode 를 읽는다. versionCode 는 릴리즈마다 1 씩 늘린다.
          node <<'JS'
          const fs = require('fs');
          const p = 'android-version.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.version = process.env.VERSION;
          json.versionCode = (Number(json.versionCode) || 0) + 1;
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          console.log(`android-version.json: ${json.version} (versionCode ${json.versionCode})`);
          JS
          echo "VERSION_FILES=android-version.json" >> "$GITHUB_ENV"

      - name: "3-2. Android 서명 키 준비"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::서명 시크릿이 없습니다 (ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD). 서명 없이 만든 apk/aab 는 배포할 수 없어 중단합니다."
              exit 1
            fi
          done
          # 키스토어는 저장소 밖에 풀어서 커밋 단계에 섞여 들어가지 않게 한다
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: "3-2. Expo prebuild (android 폴더 생성)"
        run: npx expo prebuild --platform android --no-install --clean

      - name: "3-2. 빌드 (apk, aab)"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # android 폴더는 매번 새로 만들어지므로(build.gradle 을 고칠 수 없음) 서명 정보를 Gradle 주입 속성으로 넘긴다.
          # 휴대폰용 ABI(arm)만 빌드한다 — x86 은 에뮬레이터용이라 뺀다.
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD")

          mkdir -p release-assets
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::apk가 만들어지지 않았습니다."
            exit 1
          elif [ ${#apks[@]} -eq 1 ]; then
            cp "${apks[0]}" "release-assets/${APP_NAME}-${VERSION}.apk"
          else
            for a in "${apks[@]}"; do
              b=$(basename "$a" .apk)
              cp "$a" "release-assets/${APP_NAME}-${VERSION}-${b#app-}.apk"
            done
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/${APP_NAME}-${VERSION}.aab"

      - name: "3-2. 서명 확인 (디버그 키면 중단)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in release-assets/*.apk; do
            DN=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate DN' || true)
            echo "$apk → ${DN:-서명 정보 없음}"
            if [ -z "$DN" ] || grep -q 'CN=Android Debug' <<< "$DN"; then
              echo "::error::$apk 가 업로드 키로 서명되지 않았습니다 (서명 설정을 확인하세요)."
              exit 1
            fi
          done
          for aab in release-assets/*.aab; do
            OWNER=$(keytool -printcert -jarfile "$aab" | grep -m1 'Owner:' || true)
            echo "$aab → ${OWNER:-서명 정보 없음}"
            if [ -z "$OWNER" ] || grep -q 'CN=Android Debug' <<< "$OWNER"; then
              echo "::error::$aab 가 업로드 키로 서명되지 않았습니다 (서명 설정을 확인하세요)."
              exit 1
            fi
          done

      - name: "3-3. 첨부할 빌드 결과물 확인"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::release-assets/ 에 빌드 결과물이 없습니다. 빌드 단계를 확인하세요."
            exit 1
          fi
          ls -la release-assets

      # ───────── 4. 버전 변경을 기본 브랜치에 커밋 ─────────
      - name: "4. 버전 변경을 기본 브랜치에 커밋"
        id: commit
        run: |
          set -euo pipefail
          if [ -z "${VERSION_FILES:-}" ]; then
            echo "::error::VERSION_FILES가 비어 있습니다. 3-1 단계에서 수정한 버전 파일 목록을 기록해야 합니다."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 버전 파일만 골라서 추가한다 (git add -A 금지).
          # 서명 키, key.properties, 빌드 결과물이 실수로 커밋되는 것을 막기 위해서다.
          for f in $VERSION_FILES; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "바뀐 버전 파일이 없어 커밋 없이 현재 커밋에 릴리즈합니다."
          else
            git commit -m "chore(release): ${TAG} [skip ci]"
            # 빌드 도중 기본 브랜치에 새 커밋이 들어왔다면 푸시가 거부되고 Release도 만들어지지 않는다.
            # 빌드한 코드와 태그가 가리키는 코드를 일치시키려는 의도된 동작이니, 그럴 땐 다시 실행하면 된다.
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ───────── 5. Release 페이지 생성 ─────────
      - name: "5. Release 페이지 생성 (PR 목록 + 빌드 결과물 첨부)"
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # --generate-notes: 이전 릴리즈 태그부터 이번 커밋까지 머지된 PR 목록을 GitHub가 본문에 작성한다
          ARGS=(--target "$TARGET_SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" release-assets/* "${ARGS[@]}"
          echo "### 🚀 ${TAG} 릴리즈 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # ───────── 6. Play 내부 테스트 (선택) ─────────
      # Release 는 이미 만들어진 뒤다 — 여기서 실패해도 apk·aab 는 Release 페이지에 있으니, aab 를 Play Console 에 직접 올리면 된다.
      - name: "6. Play 업로드 시크릿 확인"
        if: ${{ inputs.upload_play }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없습니다. mobile/README.md 의 'Play 내부 테스트' 를 따라 등록하거나, Release 페이지의 aab 를 Play Console 에 직접 올리세요."
            exit 1
          fi

      - name: "6. Play 내부 테스트 트랙에 업로드"
        if: ${{ inputs.upload_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: mobile/release-assets/*.aab
          releaseName: ${{ env.TAG }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
