# 안드로이드 앱(mobile/) 검사 + 미리보기 APK
#
# 수동으로만 돈다 (PR 마다 자동으로 돌던 것은 껐다): Actions → "Android Check" → Run workflow 에서 브랜치를 골라 실행.
#   gh workflow run android-check.yml --ref <브랜치>
#
#   1. iOS 워크플로(ios-testflight.yml)의 check 잡과 같은 검사 + 안드로이드 번들
#   2. Expo prebuild → Gradle 로 미리보기 APK 를 만들어 아티팩트로 올린다 (실행 화면 맨 아래 Artifacts 에서 내려받아 폰에 설치)
#
# 미리보기 APK 는 서명 시크릿 없이 디버그 키로 서명한다 — 배포용이 아니다 (배포는 release.yml).
# 패키지 이름이 com.swpark3179.quizword2.preview 라서 정식 앱과 나란히 깔리고, 학습 기록도 서로 따로다.
# 빌드 시간을 줄이려고 arm64-v8a(요즘 휴대폰) 하나만 만든다 — 정식 Release 는 32비트 arm 도 포함한다.
# 정식 Release 처럼 R8 로 줄이고 난독화한다(app.config.ts 의 expo-build-properties) — R8 때문에 생기는 문제를 머지 전에 폰에서 잡으려는 것.
# 미리보기가 죽으면 같이 올라가는 quiz-word-preview-mapping 의 mapping.txt 로 스택을 원래 이름으로 되돌린다 (mobile/README.md '난독화(R8)').

name: Android Check

on:
  # PR 자동 실행은 끔 — 미리보기 APK 가 필요할 때만 돌린다. 다시 켜려면 아래 pull_request 블록을 되살린다.
  # pull_request:
  #   paths:
  #     - 'mobile/**'
  #     - 'src/lib/**'
  #     - 'data/**'
  #     - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치로 다시 실행하면 앞선 실행은 멈춘다
concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check · preview APK
    runs-on: ubuntu-latest
    # 정상이면 Gradle 단계까지 20분 안팎 — 멈추면 빨리 드러나게 한다
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·빌드 캐시를 실행 사이에 재사용한다 (캐시는 기본 브랜치 실행이 쓰고, PR 은 읽기만 한다)
      - uses: gradle/actions/setup-gradle@v5

      - name: Shared logic tests & data validation
        run: |
          npm ci
          npx vitest run
          npm run data:validate

      - name: Mobile typecheck · lint · Android bundle
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npx expo lint
          npx expo export --platform android --output-dir dist-android

      - name: Expo prebuild (android)
        working-directory: mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle memory
        run: |
          # Expo prebuild 가 만드는 android/gradle.properties 는 Gradle 메모리를 -Xmx2048m -XX:MaxMetaspaceSize=512m 로 잡는데,
          # 모듈이 많은 이 프로젝트는 그 한도를 넘겨 OutOfMemoryError: Metaspace 로 빌드가 끝나지 않고 멈춘다.
          # 사용자 홈의 gradle.properties 는 프로젝트 것보다 우선하고 저장소 밖이라 커밋에 섞이지 않는다.
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      # prebuild 가 만든 build.gradle 은 release 도 디버그 키로 서명한다 → 시크릿 없이 설치 가능한 APK 가 나온다
      - name: Build preview APK
        working-directory: mobile/android
        env:
          APP_VARIANT: preview
        run: |
          chmod +x gradlew
          # 릴리즈 전용 린트(lintVital*)는 건너뛴다 — android 폴더는 매번 새로 만드는 생성물이라 잡아 줄 우리 코드가 없고,
          # 메모리를 가장 많이 쓰는 단계다. --console=plain 은 태스크별 진행을 로그에 남긴다.
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/quiz-word-preview.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: quiz-word-preview-apk
          path: quiz-word-preview.apk
          retention-days: 14

      # R8 가독화 파일 — 미리보기 APK 의 크래시 스택(난독화된 이름)을 retrace 로 되돌릴 때만 쓴다
      - uses: actions/upload-artifact@v6
        with:
          name: quiz-word-preview-mapping
          path: mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
