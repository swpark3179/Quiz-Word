# iOS 앱(mobile/) 빌드 → TestFlight 업로드
#
# Quiz-Bank 의 native-build-testflight.yml (build-ios · submit-testflight 잡)과 같은 방식:
#   Expo prebuild → CocoaPods → xcodebuild archive/export(수동 서명) → altool 로 TestFlight 업로드
# EAS Build·OTA 는 쓰지 않는다. 화면·로직을 고치면 이 워크플로로 빌드하고, 단어만 바뀌면 빌드 없이 단어 세트 파일로 옮긴다(mobile/README.md).
#
# 실행: Actions → "iOS TestFlight" → Run workflow
#   gh workflow run ios-testflight.yml -f upload_testflight=true
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions)
#   Quiz-Bank 와 같은 값을 다시 입력:
#     IOS_P12_BASE64                  - 배포(Distribution) .p12 인증서 base64
#     IOS_P12_PASSWORD                - p12 비밀번호
#     IOS_KEYCHAIN_PASSWORD           - 빌드용 임시 키체인 비밀번호 (아무 문자열)
#     IOS_TEAM_ID                     - Apple Developer Team ID
#     IOS_CODE_SIGN_IDENTITY          - p12 인증서 이름. 보통 Apple Distribution (따옴표 없이)
#                                       또는 전체 이름 Apple Distribution: 이름 (TEAMID). 2019년 이전 인증서는 iPhone Distribution
#     ASC_KEY_ID / ASC_ISSUER_ID      - App Store Connect API 키
#     ASC_PRIVATE_KEY                 - AuthKey_XXXX.p8 내용 (원문 또는 base64)
#   이 앱용으로 새로 만들기:
#     IOS_PROVISIONING_PROFILE_BASE64 - com.swpark3179.quizword2 의 App Store 프로비저닝 프로파일 base64
#     IOS_PROVISIONING_PROFILE_NAME   - 그 프로파일의 Name (UUID 아님)

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload the build to TestFlight'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.swpark3179.quizword2
  NODE_VERSION: 22

jobs:
  check:
    name: Check (tests · types · iOS bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Shared logic tests & data validation
        run: |
          npm ci
          npx vitest run
          npm run data:validate
      - name: Mobile typecheck & iOS bundle
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npx expo lint
          npx expo export --platform ios --output-dir dist

  build-ios:
    name: Build iOS IPA
    needs: check
    # App Store Connect 는 iOS 26 SDK(Xcode 26+)로 만든 빌드만 받는다
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 프로파일이 번들 ID·팀·이름과 안 맞으면 archive 단계(약 10분 뒤)에서야 실패하므로 먼저 검사한다
      - name: Validate provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          PROFILE="$RUNNER_TEMP/check.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE" 2>/dev/null || true
          # .mobileprovision 은 서명된 CMS 지만 plist 본문이 평문으로 들어 있어 그 부분만 잘라 읽는다
          status=0
          python3 - "$PROFILE" <<'PY' || status=$?
          import datetime, os, plistlib, sys
          raw = open(sys.argv[1], 'rb').read()
          start, end = raw.find(b'<?xml'), raw.find(b'</plist>')
          if start < 0 or end < 0:
              print('::error::IOS_PROVISIONING_PROFILE_BASE64 가 .mobileprovision 파일의 base64 가 아닙니다.')
              sys.exit(1)
          p = plistlib.loads(raw[start:end + len(b'</plist>')])
          bundle = os.environ['BUNDLE_ID']
          team = (p.get('TeamIdentifier') or [''])[0]
          app_id = p.get('Entitlements', {}).get('application-identifier', '')
          profile_bundle = app_id.split('.', 1)[1] if '.' in app_id else app_id
          expires = p.get('ExpirationDate')
          print(f"Profile App ID: {profile_bundle} / expires: {expires:%Y-%m-%d}" if expires else f"Profile App ID: {profile_bundle}")
          errors = []
          if profile_bundle not in (bundle, '*'):
              errors.append(f'프로파일의 App ID 는 {profile_bundle} 인데 앱 번들 ID 는 {bundle} 입니다. '
                            f'Apple Developer 에서 {bundle} 용 App Store 프로파일을 새로 만들고 '
                            'IOS_PROVISIONING_PROFILE_BASE64 와 IOS_PROVISIONING_PROFILE_NAME 을 바꾸세요.')
          want_team = os.environ.get('IOS_TEAM_ID', '')
          if want_team and team != want_team:
              errors.append('프로파일의 Team ID 가 IOS_TEAM_ID 와 다릅니다.')
          want_name = os.environ.get('IOS_PROVISIONING_PROFILE_NAME', '')
          if want_name and p.get('Name') != want_name:
              errors.append('IOS_PROVISIONING_PROFILE_NAME 이 프로파일의 Name 과 다릅니다 (UUID 가 아니라 Name, 대소문자·공백까지 같아야 함).')
          if p.get('ProvisionedDevices') or p.get('ProvisionsAllDevices'):
              errors.append('App Store 배포용 프로파일이 아닙니다 (Development / Ad Hoc / Enterprise). Distribution → App Store Connect 로 만드세요.')
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          if expires and expires < now:
              errors.append(f'프로파일이 {expires:%Y-%m-%d} 에 만료됐습니다. 다시 만드세요.')
          for e in errors:
              print(f'::error::{e}')
          sys.exit(1 if errors else 0)
          PY
          rm -f "$PROFILE"
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1); fi
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=/Applications/Xcode.app; fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install dependencies (shared code & data are synced by postinstall)
        working-directory: mobile
        run: npm ci

      - name: Expo prebuild (ios)
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Setup signing keychain
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for v in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          KEYCHAIN=build.keychain
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          echo "$IOS_P12_BASE64" | base64 -d > cert.p12
          # OpenSSL 3 은 옛 p12 알고리즘을 거부하므로 -legacy 로 확인만 한다 (실제 등록은 security import)
          if openssl pkcs12 -legacy -in cert.p12 -nokeys -passin "pass:$IOS_P12_PASSWORD" -info -noout 2>&1; then
            echo "p12 verification OK"
          else
            echo "::warning::openssl could not parse the p12 even with -legacy; relying on 'security import'."
          fi
          import_p12() { security import "$1" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; }
          if ! import_p12 cert.p12; then
            # Windows 내보내기·OpenSSL 3 기본값(AES-256 + SHA-256 MAC) p12 는 macOS 가 읽지 못하고
            # "MAC verification failed (wrong password?)" 를 낸다 → 3DES + SHA-1 MAC 형식으로 바꿔 다시 넣는다.
            echo "::warning::macOS could not import the p12 (likely AES/SHA-256 format); converting to 3DES/SHA-1 and retrying."
            ( umask 077; openssl pkcs12 -legacy -in cert.p12 -nodes -passin "pass:$IOS_P12_PASSWORD" -out cert.pem ) \
              || { rm -f cert.p12 cert.pem; echo "::error::openssl could not open the p12 either — check IOS_P12_PASSWORD / IOS_P12_BASE64."; exit 1; }
            openssl pkcs12 -export -in cert.pem -passout "pass:$IOS_P12_PASSWORD" \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 -out cert-legacy.p12
            rm -f cert.pem
            import_p12 cert-legacy.p12
          fi
          rm -f cert.p12 cert-legacy.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_DIR/profile.mobileprovision"

      - name: Build & archive
        working-directory: mobile/ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          for v in IOS_TEAM_ID IOS_CODE_SIGN_IDENTITY IOS_PROVISIONING_PROFILE_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"

      - name: Export IPA (app-store)
        working-directory: mobile/ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/build/ipa"
          IPA=$(find "$PWD/build/ipa" -name "*.ipa" | head -n1)
          cp "$IPA" "$GITHUB_WORKSPACE/app-release.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: app-release.ipa

  submit-testflight:
    name: Upload to TestFlight (altool)
    needs: build-ios
    if: ${{ github.event.inputs.upload_testflight == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-ipa

      - name: Verify TestFlight secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.ASC_KEY_ID }}" ]      && MISSING="$MISSING ASC_KEY_ID"
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ]   && MISSING="$MISSING ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ] && MISSING="$MISSING ASC_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then echo "::error::Missing secrets:$MISSING"; exit 1; fi

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # altool 은 ~/private_keys/AuthKey_<KEY_ID>.p8 를 찾는다. PEM 이 깨지지 않게 printf 로 쓰고 CRLF 를 지운다.
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          tr -d '\r' < "$KEY_PATH" > "$KEY_PATH.tmp" && mv "$KEY_PATH.tmp" "$KEY_PATH"
          if ! head -n1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            tr -d ' \t\r\n' < "$KEY_PATH" | base64 -d > "$KEY_PATH.decoded" 2>/dev/null || { echo "::error::ASC_PRIVATE_KEY is neither a PEM nor valid base64."; exit 1; }
            mv "$KEY_PATH.decoded" "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          head -n1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::AuthKey file is not a valid PEM private key."; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f app-release.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f app-release.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
